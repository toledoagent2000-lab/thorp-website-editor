<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>O.A. Thorp Scholastic Academy Portal Editor</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel Standalone for in-browser JSX parsing -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* Custom Scrollbar Styling */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Authentic O.A. Thorp Initial Data
    const INITIAL_NEWS = [
      {
        id: 'news-1',
        title: 'Thorpie Express: Golden Eagle Attendance & Saturday Support',
        category: 'Principal Update',
        date: 'Nov 2, 2026',
        author: 'Principal Toledo',
        summary: 'Congratulations to our Golden Eagle homeroom attendance winners! Thorp Saturday Enrichment & Academic Catch-up sessions start this weekend.'
      },
      {
        id: 'news-2',
        title: 'Friends of Thorp (FOT) Fall Fest & Community Dine-Out',
        category: 'Community',
        date: 'Oct 28, 2026',
        author: 'Friends of Thorp',
        summary: "Thank you to all families who attended our Fall Fest! Join us for our upcoming Culver's Dine-Out fundraiser supporting Thorp STEM labs."
      }
    ];

    const INITIAL_STAFF = [
      {
        id: 'staff-1',
        name: 'Mr. Toledo',
        title: 'Principal',
        department: 'Admin',
        email: 'ptoledo@cps.edu',
        photo: 'https://images.unsplash.com/photo-1560250097-0b93528c311a?auto=format&fit=crop&w=300&q=80'
      },
      {
        id: 'staff-2',
        name: 'Ms. McNally',
        title: 'Assistant Principal',
        department: 'Admin',
        email: 'mmcnally@cps.edu',
        photo: 'https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&fit=crop&w=300&q=80'
      },
      {
        id: 'staff-3',
        name: 'Ms. Santos',
        title: 'STEM & Robotics Lead',
        department: 'Science',
        email: 'esantos@cps.edu',
        photo: 'https://images.unsplash.com/photo-1580489944761-15a19d654956?auto=format&fit=crop&w=300&q=80'
      }
    ];

    function App() {
      const [sidebarTab, setSidebarTab] = useState('pages'); // 'pages', 'slides', 'news', 'staff', 'alerts', 'theme'
      const [activePage, setActivePage] = useState('home');
      const [isPreviewMode, setIsPreviewMode] = useState(false);
      const [isInlineEditMode, setIsInlineEditMode] = useState(true);

      // School Logo URL state
      const [schoolLogoUrl, setSchoolLogoUrl] = useState('');

      const [newsList, setNewsList] = useState(INITIAL_NEWS);
      const [staffList, setStaffList] = useState(INITIAL_STAFF);
      const [staffFilter, setStaffFilter] = useState('All');

      // Alert State
      const [activeAlert, setActiveAlert] = useState({
        enabled: true,
        message: 'NOTICE: Parent-Teacher Conferences today from 12 PM - 6 PM. Election Day Tomorrow - No School for Students.'
      });

      // Staff Form with Photo URL
      const [staffForm, setStaffForm] = useState({ name: '', title: '', email: '', department: 'Admin', photo: '' });
      // News Form
      const [newsForm, setNewsForm] = useState({ title: '', category: 'Principal Update', summary: '' });

      const handleAddStaff = (e) => {
        if (e) e.preventDefault();
        if (!staffForm.name || !staffForm.title) return;
        const newMember = {
          id: `staff-${Date.now()}`,
          name: staffForm.name,
          title: staffForm.title,
          department: staffForm.department,
          email: staffForm.email || 'staff@cps.edu',
          photo: staffForm.photo || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=300&q=80'
        };
        setStaffList([...staffList, newMember]);
        setStaffForm({ name: '', title: '', email: '', department: 'Admin', photo: '' });
      };

      const handleDeleteStaff = (id) => {
        setStaffList(staffList.filter(s => s.id !== id));
      };

      const handleAddNews = (e) => {
        if (e) e.preventDefault();
        if (!newsForm.title || !newsForm.summary) return;
        const newItem = {
          id: `news-${Date.now()}`,
          title: newsForm.title,
          category: newsForm.category,
          date: 'Nov 2, 2026',
          author: 'Administration',
          summary: newsForm.summary
        };
        setNewsList([newItem, ...newsList]);
        setNewsForm({ title: '', category: 'Principal Update', summary: '' });
      };

      const filteredStaff = staffFilter === 'All' ? staffList : staffList.filter(s => s.department === staffFilter);

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col font-sans">
          
          {/* TOP MANAGEMENT BAR */}
          <header className="h-14 bg-slate-900 border-b border-slate-800 flex items-center justify-between px-6 sticky top-0 z-50">
            <div className="flex items-center gap-3">
              <span className="font-black text-amber-400 text-lg tracking-tight">O.A. THORP ACADEMY</span>
              <span className="text-xs bg-slate-800 text-slate-300 px-2.5 py-0.5 rounded-full font-mono border border-slate-700">
                Dashboard & Quick Editor
              </span>
            </div>

            <div className="flex items-center gap-3">
              {!isPreviewMode && (
                <button
                  onClick={() => setIsInlineEditMode(!isInlineEditMode)}
                  className={`px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5 ${isInlineEditMode ? 'bg-amber-400 text-slate-950' : 'bg-slate-800 text-slate-300'}`}
                >
                  ✏️ {isInlineEditMode ? 'Click-to-Edit ON' : 'Click-to-Edit OFF'}
                </button>
              )}
              <button
                onClick={() => setIsPreviewMode(!isPreviewMode)}
                className="px-4 py-1.5 bg-blue-600 hover:bg-blue-500 rounded-lg text-xs font-bold text-white transition shadow"
              >
                {isPreviewMode ? '⚙️ Open Dashboard Editor' : '👁️ View Live Website'}
              </button>
            </div>
          </header>

          {/* MAIN WORKSPACE */}
          <div className="flex-1 flex overflow-hidden">
            
            {/* SIDEBAR EDIT PANEL */}
            {!isPreviewMode && (
              <aside className="w-80 bg-slate-900 border-r border-slate-800 flex flex-col z-30">
                
                {/* Sidebar Navigation Tabs with Clear Labels */}
                <div className="grid grid-cols-6 border-b border-slate-800 bg-slate-950/60 text-[10px] font-bold">
                  {[
                    { id: 'pages', icon: '🏫', label: 'Pages' },
                    { id: 'news', icon: '📢', label: 'News' },
                    { id: 'staff', icon: '👥', label: 'Staff' },
                    { id: 'alerts', icon: '🔔', label: 'Alerts' },
                    { id: 'theme', icon: '🎨', label: 'Theme' },
                    { id: 'logo', icon: '🖼️', label: 'Logo' }
                  ].map((tab) => (
                    <button
                      key={tab.id}
                      onClick={() => setSidebarTab(tab.id)}
                      className={`py-3 flex flex-col items-center gap-1 transition ${sidebarTab === tab.id ? 'bg-slate-900 text-amber-400 border-b-2 border-amber-400' : 'text-slate-400 hover:text-white'}`}
                      title={`Edit ${tab.label}`}
                    >
                      <span className="text-sm">{tab.icon}</span>
                      <span>{tab.label}</span>
                    </button>
                  ))}
                </div>

                {/* Sidebar Tab Panels */}
                <div className="p-4 space-y-4 overflow-y-auto flex-1">
                  
                  {sidebarTab === 'pages' && (
                    <div className="space-y-3">
                      <h3 className="text-xs font-extrabold uppercase tracking-wider text-amber-400">🏫 Website Navigation Pages</h3>
                      <p className="text-[11px] text-slate-400">Select a page to view and edit its text directly on the right canvas:</p>
                      {[
                        { id: 'home', label: 'Home Page' },
                        { id: 'about', label: 'About Thorp (Vision & 5Cs)' },
                        { id: 'academics', label: 'Academics & Magnet' },
                        { id: 'directory', label: 'Staff Directory' },
                        { id: 'parents', label: 'Parents & Community' }
                      ].map((page) => (
                        <button
                          key={page.id}
                          onClick={() => setActivePage(page.id)}
                          className={`w-full text-left p-3 rounded-xl border text-xs font-bold transition flex items-center justify-between ${activePage === page.id ? 'bg-amber-500/10 border-amber-400 text-amber-400' : 'bg-slate-950/60 border-slate-800 text-slate-300 hover:bg-slate-800'}`}
                        >
                          <span>{page.label}</span>
                          {activePage === page.id && <span>✓</span>}
                        </button>
                      ))}
                    </div>
                  )}

                  {sidebarTab === 'news' && (
                    <div className="space-y-3">
                      <h3 className="text-xs font-extrabold uppercase tracking-wider text-amber-400">📢 Thorpie Express News</h3>
                      <form onSubmit={handleAddNews} className="space-y-3 bg-slate-950/60 p-3 rounded-xl border border-slate-800">
                        <div>
                          <label className="text-[10px] text-slate-400 font-semibold uppercase">Headline</label>
                          <input 
                            type="text" 
                            placeholder="Announcement title..." 
                            value={newsForm.title} 
                            onChange={(e) => setNewsForm({ ...newsForm, title: e.target.value })} 
                            className="w-full bg-slate-800 border border-slate-700 rounded px-2.5 py-1.5 text-xs text-white mt-1" 
                          />
                        </div>
                        <div>
                          <label className="text-[10px] text-slate-400 font-semibold uppercase">Category</label>
                          <select 
                            value={newsForm.category} 
                            onChange={(e) => setNewsForm({ ...newsForm, category: e.target.value })} 
                            className="w-full bg-slate-800 border border-slate-700 rounded px-2.5 py-1.5 text-xs text-white mt-1"
                          >
                            <option value="Principal Update">Principal Update</option>
                            <option value="Academics">Academics & IAR</option>
                            <option value="Community">Friends of Thorp (FOT)</option>
                            <option value="Athletics">Athletics & Houses</option>
                          </select>
                        </div>
                        <div>
                          <label className="text-[10px] text-slate-400 font-semibold uppercase">Summary</label>
                          <textarea 
                            rows={3} 
                            placeholder="Announcement text..." 
                            value={newsForm.summary} 
                            onChange={(e) => setNewsForm({ ...newsForm, summary: e.target.value })} 
                            className="w-full bg-slate-800 border border-slate-700 rounded px-2.5 py-1.5 text-xs text-white mt-1 resize-none" 
                          />
                        </div>
                        <button type="submit" className="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-1.5 rounded-lg text-xs transition">
                          + Publish to Homepage
                        </button>
                      </form>
                    </div>
                  )}

                  {sidebarTab === 'staff' && (
                    <div className="space-y-3">
                      <h3 className="text-xs font-extrabold uppercase tracking-wider text-amber-400">👥 Staff & Faculty Directory</h3>
                      <p className="text-[11px] text-slate-400">Add staff members below or click directly on any card on the Staff Directory page to edit:</p>
                      <form onSubmit={handleAddStaff} className="space-y-3 bg-slate-950/60 p-3 rounded-xl border border-slate-800">
                        <input
                          type="text"
                          placeholder="Staff Name"
                          value={staffForm.name}
                          onChange={(e) => setStaffForm({ ...staffForm, name: e.target.value })}
                          className="w-full bg-slate-800 border border-slate-700 rounded px-2.5 py-1.5 text-xs text-white"
                        />
                        <input
                          type="text"
                          placeholder="Title / Role"
                          value={staffForm.title}
                          onChange={(e) => setStaffForm({ ...staffForm, title: e.target.value })}
                          className="w-full bg-slate-800 border border-slate-700 rounded px-2.5 py-1.5 text-xs text-white"
                        />
                        <input
                          type="text"
                          placeholder="Email"
                          value={staffForm.email}
                          onChange={(e) => setStaffForm({ ...staffForm, email: e.target.value })}
                          className="w-full bg-slate-800 border border-slate-700 rounded px-2.5 py-1.5 text-xs text-white"
                        />
                        <input
                          type="text"
                          placeholder="Photo Image Link / URL"
                          value={staffForm.photo}
                          onChange={(e) => setStaffForm({ ...staffForm, photo: e.target.value })}
                          className="w-full bg-slate-800 border border-slate-700 rounded px-2.5 py-1.5 text-xs text-white font-mono text-[10px]"
                        />
                        <button type="submit" className="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-1.5 rounded-lg text-xs transition">
                          + Save Faculty Profile
                        </button>
                      </form>
                    </div>
                  )}

                  {sidebarTab === 'alerts' && (
                    <div className="space-y-3">
                      <h3 className="text-xs font-extrabold uppercase tracking-wider text-amber-400">Urgent Banner Alert</h3>
                      <div className="bg-slate-950/60 p-3 rounded-xl border border-slate-800 space-y-2">
                        <label className="flex items-center gap-2 cursor-pointer text-xs font-bold text-slate-200">
                          <input
                            type="checkbox"
                            checked={activeAlert.enabled}
                            onChange={(e) => setActiveAlert({ ...activeAlert, enabled: e.target.checked })}
                            className="rounded text-amber-400"
                          />
                          Enable Yellow Top Alert Banner
                        </label>
                        <textarea
                          rows={3}
                          value={activeAlert.message}
                          onChange={(e) => setActiveAlert({ ...activeAlert, message: e.target.value })}
                          className="w-full bg-slate-800 border border-slate-700 rounded px-2.5 py-1.5 text-xs text-white resize-none mt-1"
                        />
                      </div>
                    </div>
                  )}

                  {sidebarTab === 'logo' && (
                    <div className="space-y-3">
                      <h3 className="text-xs font-extrabold uppercase tracking-wider text-amber-400">School Crest & Logo</h3>
                      <div className="bg-slate-950/60 p-3 rounded-xl border border-slate-800 space-y-2">
                        <label className="text-[10px] text-slate-400 font-semibold uppercase">Logo Image URL</label>
                        <input
                          type="text"
                          placeholder="https://oathorpacademy.org/.../logo.png"
                          value={schoolLogoUrl}
                          onChange={(e) => setSchoolLogoUrl(e.target.value)}
                          className="w-full bg-slate-800 border border-slate-700 rounded px-2.5 py-1.5 text-xs text-white font-mono text-[10px]"
                        />
                        <p className="text-[10px] text-slate-400">Paste your school crest image link above to update the header crest badge.</p>
                      </div>
                    </div>
                  )}

                  {sidebarTab === 'theme' && (
                    <div className="space-y-3">
                      <h3 className="text-xs font-extrabold uppercase tracking-wider text-amber-400">Color Themes</h3>
                      <div className="p-3 bg-slate-950/60 border border-slate-800 rounded-xl space-y-2">
                        <div className="text-xs font-bold text-slate-200">Thorp Royal Blue & Gold (Official)</div>
                        <div className="flex gap-2">
                          <div className="h-4 flex-1 bg-blue-950 rounded"></div>
                          <div className="h-4 flex-1 bg-amber-400 rounded"></div>
                        </div>
                      </div>
                    </div>
                  )}

                </div>
              </aside>
            )}

            {/* LIVE WEBSITE PREVIEW CANVAS */}
            <main className="flex-1 bg-slate-950 overflow-y-auto p-6 flex justify-center items-start">
              <div className="w-full max-w-[1100px] bg-white rounded-xl shadow-2xl overflow-hidden text-slate-900 border border-slate-800">
                
                {/* URGENT TOP ALERT BAR */}
                {activeAlert.enabled && (
                  <div className="bg-amber-400 text-slate-950 px-4 py-2 font-bold text-xs flex items-center justify-between border-b border-amber-500">
                    <span>🔔 {activeAlert.message}</span>
                  </div>
                )}

                {/* SCHOOL HEADER */}
                <header className="bg-blue-950 text-white p-6 border-b-4 border-amber-400 flex items-center justify-between">
                  <div className="flex items-center gap-4">
                    {schoolLogoUrl ? (
                      <img src={schoolLogoUrl} alt="School Logo" className="w-14 h-14 rounded-full object-cover border-2 border-amber-400 shadow" />
                    ) : (
                      <div 
                        onClick={() => {
                          const url = prompt('Enter image URL for School Logo:');
                          if (url !== null) setSchoolLogoUrl(url);
                        }}
                        className="w-14 h-14 rounded-full bg-blue-900 border-2 border-amber-400 flex items-center justify-center font-bold text-amber-400 text-xl cursor-pointer hover:bg-blue-800 transition"
                        title="Click to change logo"
                      >
                        OA
                      </div>
                    )}
                    <div>
                      <h1 
                        contentEditable={isInlineEditMode && !isPreviewMode}
                        suppressContentEditableWarning={true}
                        className={`text-xl md:text-2xl font-black text-amber-400 ${isInlineEditMode && !isPreviewMode ? 'hover:outline hover:outline-dashed hover:outline-amber-400 p-0.5 rounded' : ''}`}
                      >
                        O.A. Thorp Scholastic Academy
                      </h1>
                      <p 
                        contentEditable={isInlineEditMode && !isPreviewMode}
                        suppressContentEditableWarning={true}
                        className="text-xs text-slate-300 font-medium"
                      >
                        Chicago Public Schools • 6024 W Warwick Ave • (773) 534-3640
                      </p>
                    </div>
                  </div>
                  <a href="tel:7735343640" className="bg-amber-400 hover:bg-amber-300 text-slate-950 px-4 py-2 rounded-lg font-bold text-xs transition">
                    📞 Call Main Office
                  </a>
                </header>

                {/* NAVIGATION BAR */}
                <nav className="bg-slate-900 text-slate-200 border-b border-slate-800 px-6 flex items-center gap-2 overflow-x-auto text-xs font-bold">
                  {[
                    { id: 'home', label: 'Home' },
                    { id: 'about', label: 'About Thorp' },
                    { id: 'academics', label: 'Academics & 5C\'s' },
                    { id: 'directory', label: 'Staff Directory' },
                    { id: 'parents', label: 'Parents & Community' }
                  ].map((tab) => (
                    <button
                      key={tab.id}
                      onClick={() => setActivePage(tab.id)}
                      className={`px-4 py-3 transition border-b-2 whitespace-nowrap ${activePage === tab.id ? 'border-amber-400 text-amber-400 bg-slate-800/60' : 'border-transparent text-slate-400 hover:text-white'}`}
                    >
                      {tab.label}
                    </button>
                  ))}
                </nav>

                {/* PAGE BODY */}
                <div className="p-6">
                  {activePage === 'home' && (
                    <div className="space-y-6">
                      <div className="flex items-center justify-between border-b pb-2 border-slate-200">
                        <h2 className="text-lg font-black text-slate-900">Thorpie Express Announcements</h2>
                        <span className="text-xs text-slate-500 font-semibold">{newsList.length} Announcements</span>
                      </div>
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        {newsList.map((item) => (
                          <div key={item.id} className="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-2">
                            <span className="text-[10px] font-bold px-2 py-0.5 rounded bg-blue-100 text-blue-800 uppercase">{item.category}</span>
                            <h3 
                              contentEditable={isInlineEditMode && !isPreviewMode}
                              suppressContentEditableWarning={true}
                              className={`font-bold text-slate-900 text-sm ${isInlineEditMode && !isPreviewMode ? 'hover:outline hover:outline-dashed hover:outline-amber-400 p-0.5 rounded' : ''}`}
                            >
                              {item.title}
                            </h3>
                            <p 
                              contentEditable={isInlineEditMode && !isPreviewMode}
                              suppressContentEditableWarning={true}
                              className={`text-xs text-slate-600 leading-relaxed ${isInlineEditMode && !isPreviewMode ? 'hover:outline hover:outline-dashed hover:outline-amber-400 p-0.5 rounded' : ''}`}
                            >
                              {item.summary}
                            </p>
                            <p className="text-[10px] text-slate-400 font-medium">{item.date} • {item.author}</p>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}

                  {activePage === 'directory' && (
                    <div className="space-y-6">
                      <div className="flex items-center justify-between border-b pb-3 border-slate-200">
                        <div>
                          <h2 className="text-lg font-black text-slate-900">Faculty & Staff Directory</h2>
                          <p className="text-xs text-slate-500">Contact staff members and administration</p>
                        </div>
                        <div className="flex gap-2">
                          {['All', 'Admin', 'Primary', 'Science'].map((dept) => (
                            <button
                              key={dept}
                              onClick={() => setStaffFilter(dept)}
                              className={`px-3 py-1 rounded-full text-xs font-bold ${staffFilter === dept ? 'bg-amber-400 text-slate-950' : 'bg-slate-100 text-slate-600'}`}
                            >
                              {dept}
                            </button>
                          ))}
                        </div>
                      </div>

                      <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                        {filteredStaff.map((staff) => (
                          <div key={staff.id} className="bg-slate-50 p-4 rounded-xl border border-slate-200 flex flex-col items-center text-center relative group">
                            {!isPreviewMode && (
                              <button
                                onClick={() => handleDeleteStaff(staff.id)}
                                className="absolute top-2 right-2 text-rose-500 hover:text-rose-700 p-1 text-xs font-bold"
                                title="Delete staff member"
                              >
                                ✕
                              </button>
                            )}
                            <img 
                              src={staff.photo} 
                              alt={staff.name} 
                              onClick={() => {
                                if (isPreviewMode) return;
                                const newPhoto = prompt('Enter image URL for staff photo:', staff.photo);
                                if (newPhoto) {
                                  setStaffList(staffList.map(s => s.id === staff.id ? { ...s, photo: newPhoto } : s));
                                }
                              }}
                              className="w-20 h-20 rounded-full object-cover border-2 border-amber-400 mb-2 shadow cursor-pointer hover:opacity-80 transition" 
                              title="Click to update image URL"
                            />
                            <h4 
                              contentEditable={isInlineEditMode && !isPreviewMode}
                              suppressContentEditableWarning={true}
                              className="font-bold text-slate-900 text-sm"
                            >
                              {staff.name}
                            </h4>
                            <p 
                              contentEditable={isInlineEditMode && !isPreviewMode}
                              suppressContentEditableWarning={true}
                              className="text-xs text-blue-900 font-semibold"
                            >
                              {staff.title}
                            </p>
                            <p className="text-[10px] text-slate-500 mt-1">{staff.department}</p>
                            <a href={`mailto:${staff.email}`} className="text-[11px] text-blue-600 font-mono mt-2 hover:underline">
                              {staff.email}
                            </a>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}

                  {activePage === 'about' && (
                    <div className="space-y-6">
                      <h2 className="text-xl font-black text-slate-900 border-b pb-2">About Ole A. Thorp Scholastic Academy</h2>
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-6 text-xs text-slate-700">
                        <div className="bg-slate-50 p-4 rounded-xl border space-y-2">
                          <h3 className="font-bold text-slate-900 text-sm">Our Vision & Philosophy</h3>
                          <p 
                            contentEditable={isInlineEditMode && !isPreviewMode}
                            suppressContentEditableWarning={true}

                        </div>
                        <div className="bg-slate-50 p-4 rounded-xl border space-y-2">
                          <h3 className="font-bold text-slate-900 text-sm">The 5 C's Framework</h3>
                          <ul className="space-y-1 list-disc pl-4">
                            <li><strong>Critical Thinking:</strong> Socratic questioning</li>
                            <li><strong>Creativity:</strong> Weekly Fine Arts & Programming</li>
                            <li><strong>Collaboration:</strong> Differentiated rotation centers</li>
                            <li><strong>Communication:</strong> Student presentation</li>
                            <li><strong>Caring:</strong> Active community involvement</li>
                          </ul>
                        </div>
                      </div>
                    </div>
                  )}

                  {activePage === 'academics' && (
                    <div className="space-y-4">
                      <h2 className="text-xl font-black text-slate-900 border-b pb-2">Academics & Magnet Program</h2>
                      <div className="bg-slate-50 p-4 rounded-xl border space-y-2 text-xs text-slate-700">
                        <h3 className="font-bold text-sm text-slate-900">Active Learning Rotations</h3>
                        <p 
                          contentEditable={isInlineEditMode && !isPreviewMode}
                          suppressContentEditableWarning={true}
                          className="leading-relaxed"
                        >
                          Instruction at Thorp is characterized by small-group learning centers. Rotations occur every 20-40 minutes, ensuring students are challenged at their precise instructional level.
                        </p>
                      </div>
                    </div>
                  )}

                  {activePage === 'parents' && (
                    <div className="space-y-4">
                      <h2 className="text-xl font-black text-slate-900 border-b pb-2">Parents & Community</h2>
                      <div className="grid grid-cols-1 md:grid-cols-3 gap-4 text-xs">
                        <div className="bg-slate-50 p-4 rounded-xl border space-y-2">
                          <h3 className="font-bold text-slate-900 text-sm">Friends of Thorp (FOT)</h3>
                          <p className="text-slate-600">Fundraising organization supporting technology, STEM equipment, and student enrichment.</p>
                        </div>
                        <div className="bg-slate-50 p-4 rounded-xl border space-y-2">
                          <h3 className="font-bold text-slate-900 text-sm">Thorp PTA</h3>
                          <p className="text-slate-600">Parent Teacher Association organizing Book Fairs, Fall Fest, and school events.</p>
                        </div>
                        <div className="bg-slate-50 p-4 rounded-xl border space-y-2">
                          <h3 className="font-bold text-slate-900 text-sm">Local School Council (LSC)</h3>
                          <p className="text-slate-600">Elected body guiding continuous improvement plans and academic budgets.</p>
                        </div>
                      </div>
                    </div>
                  )}
                </div>

                {/* FOOTER */}
                <footer className="bg-slate-900 text-slate-400 text-xs p-6 border-t border-slate-800 text-center space-y-1">
                  <p className="font-bold text-slate-200">Ole A. Thorp Scholastic Academy • Chicago Public Schools</p>
                  <p className="text-[10px]">6024 W Warwick Ave, Chicago, IL 60634 | Phone: (773) 534-3640</p>
                </footer>

              </div>
            </main>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
